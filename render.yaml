services:
  - type: web
    name: ksap-ai-desktop-support
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.15
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: OLLAMA_API_KEY
        sync: false
      - key: DEEPGRAM_TTS_VOICE
        value: aura-2-helena-en
      - key: OLLAMA_CLOUD_MODEL
        value: gemma4:31b-cloud
